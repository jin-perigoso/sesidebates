<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2d73c9"/>
      <stop offset="1" stop-color="#0f3f83"/>
    </linearGradient>
    <filter id="b1"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="b2"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="b3"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
  </defs>
  <rect width="1080" height="1920" fill="url(#bg)"/>
  <!-- bolhas / vapor -->
  <g fill="#ffffff">
    <circle cx="220" cy="330" r="90" opacity="0.10" filter="url(#soft)"/>
    <circle cx="820" cy="260" r="140" opacity="0.12" filter="url(#soft)"/>
    <circle cx="540" cy="420" r="110" opacity="0.10" filter="url(#soft)"/>
    <circle cx="300" cy="560" r="14" opacity="0.35"/>
    <circle cx="760" cy="520" r="10" opacity="0.35"/>
    <circle cx="640" cy="650" r="18" opacity="0.30"/>
    <circle cx="420" cy="700" r="8" opacity="0.40"/>
    <circle cx="880" cy="760" r="12" opacity="0.30"/>
  </g>
  <!-- palavras se dissolvendo para cima -->
  <g font-family="Inter Display, Inter" font-weight="900" text-anchor="middle" fill="#ffffff" letter-spacing="-4">
    <text x="540" y="820" font-size="220" opacity="0.35" filter="url(#b3)">VAPOR</text>
    <text x="540" y="1030" font-size="220" opacity="0.6" filter="url(#b2)">VIRA</text>
    <text x="540" y="1240" font-size="220" opacity="0.85" filter="url(#b1)">TUDO</text>
    <text x="540" y="1490" font-size="220">ENTÃO</text>
  </g>
  <!-- legenda -->
  <rect x="140" y="1570" width="800" height="96" rx="48" fill="#ffffff"/>
  <text x="540" y="1632" text-anchor="middle" font-family="Inter" font-weight="800" font-size="40" fill="#0f3f83">Ah, subiu um pouquinho… ↑</text>
  <text x="540" y="1820" text-anchor="middle" font-family="Inter" font-weight="900" font-size="34" fill="#dbe5f5" letter-spacing="4">SSD · SESI SOCIEDADE DE DEBATES</text>
</svg>
